# Local scrape configuration for the demonstration stack.
#
# The credential below matches METRICS_TOKEN in docker-compose.yml. It is a
# throwaway local value. A real deployment should use
# `authorization.credentials_file` and mount the secret, rather than inlining a
# token into a file that lives in version control.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: secure-ai-gateway
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: local-compose-metrics-token-not-for-production-use
    static_configs:
      - targets: ["gateway:8000"]
