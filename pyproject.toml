[project]
name = "secure-ai-gateway"
version = "0.1.0"
description = "Privacy-preserving gateway that tokenizes sensitive data before it reaches an LLM provider."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "openai>=1.55",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "redis>=5.2",
    "aioboto3>=13.0",
    "python-multipart>=0.0.18",
    # Document text extraction. Both are permissively licensed and
    # pure Python: pypdf is BSD-3, python-docx is MIT. PyMuPDF is faster and is
    # AGPL, which this Apache-2.0 project cannot distribute.
    "pypdf>=5.1",
    "python-docx>=1.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "cryptography>=44.0",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "tenacity>=9.0",
    "orjson>=3.10",
    "python-ulid>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "hypothesis>=6.119",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "aiosqlite>=0.20",
    "fakeredis>=2.26",
    # fakeredis cannot execute EVAL/EVALSHA without a Lua runtime, and the
    # vault's batch write (ADR-0022) is a Lua script. Without this the vault
    # suite does not fail informatively -- it fails at the first script call.
    "lupa>=2.0",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtins shadowing
    "C4",   # comprehensions
    "DTZ",  # naive datetime
    "T20",  # flake8-print -- no print()
    "SIM",  # simplify
    "TID",  # tidy imports
    "RUF",
    "S",    # bandit-style security rules
    "ASYNC",
]
ignore = [
    "S101",  # assert is expected in tests; narrowed below for app/
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
# A benchmark that cannot report its measurement is not a benchmark. These are
# excluded from the default gate and run with -s.
"tests/performance/**" = ["S105", "S106", "S311", "T201"]
"scripts/**" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "scripts"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "spacy.*",
    "fakeredis.*",
    # aioboto3 and botocore ship no py.typed marker. The S3 adapter keeps
    # every client interaction behind `Any` and translates results at its
    # own boundary, so nothing untyped escapes the module.
    "aioboto3.*",
    "aiobotocore.*",
    "botocore.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: requires disposable PostgreSQL and Redis",
    "privacy: privacy regression assertions",
    "security: security control assertions",
    "performance: performance measurement, excluded from default CI gate",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
