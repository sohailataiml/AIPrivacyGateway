# Alembic configuration.
#
# `sqlalchemy.url` is intentionally absent. The URL carries the database
# password, so it is read from the environment by migrations/env.py (via
# app.config.settings) and never committed to a file in this repository.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
timezone = UTC

# Migration filenames: 0001_description.py, ordered and greppable.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
