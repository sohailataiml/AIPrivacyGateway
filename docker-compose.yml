# Local demonstration stack.
#
# The gateway defaults to DEFAULT_PROVIDER=mock here on purpose: bringing this
# up must never make a paid API call. Point it at a real provider only by
# setting OPENAI_API_KEY and DEFAULT_PROVIDER deliberately.
#
# The keys below are throwaway local values. They are structurally valid and
# functionally worthless, and APP_ENV=local means production hardening checks
# are not what is keeping you safe here -- do not copy any of this to a
# deployed environment.

name: secure-ai-gateway

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379/0
      API_KEY_PEPPER: local-compose-pepper-not-for-production-use
      VAULT_ACTIVE_KEY_ID: local1
      VAULT_KEY_LOCAL1: bG9jYWwtY29tcG9zZS12YXVsdC1rZXktMzJieXRlcyE=
      AUDIT_HMAC_KEY: bG9jYWwtY29tcG9zZS1hdWRpdC1obWFjLTMyYnl0ZXMh
      DEFAULT_PROVIDER: mock

      # The workspace in frontend/ runs on :3000 and calls this API from the
      # browser. CORS is off by default and stays off in a deployment; the
      # local origin is listed here so `docker compose up` plus `npm run dev`
      # is a working pair without a manual step.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Document storage (ADR-0020, ADR-0021, ADR-0035). The document key ring
      # is separate from the vault's on purpose: the two protect data with
      # different lifetimes and rotate on different schedules.
      #
      # Off by default. Storage is AWS S3 now, and there is no local stand-in,
      # so a stack that enabled uploads unconditionally would fail readiness on
      # a laptop with no AWS account -- turning `docker compose up` from a
      # working demo into a broken one. To exercise the document path, export
      # credentials and flip the switch:
      #
      #   export OBJECT_STORE_ACCESS_KEY_ID=... OBJECT_STORE_SECRET_ACCESS_KEY=...
      #   DOCUMENTS_ENABLED=true OBJECT_STORE_BUCKET=your-bucket docker compose up
      #
      # The credentials below render empty when unset, which Settings reads as
      # absent rather than as an empty secret (see _blank_credential_is_absent).
      DOCUMENTS_ENABLED: ${DOCUMENTS_ENABLED:-false}
      DOCUMENT_ACTIVE_KEY_ID: local1
      # 32 bytes exactly, base64. The first version of this line decoded to 34
      # and every upload failed with a 503, because nothing in the test suite
      # reads this file. tests/unit/test_contracts.py now does.
      DOCUMENT_KEY_LOCAL1: bG9jYWwtY29tcG9zZS1kb2N1bWVudC1rZXktMzJieXQ=
      OBJECT_STORE_PROVIDER: aws
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-sgw-documents}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:-}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:-}
      # Off by default everywhere else; on here so the local demo shows the
      # masked preview without an extra step (architecture.md 22.6).
      PROTECTED_PREVIEW_ENABLED: ${PROTECTED_PREVIEW_ENABLED:-true}
      # Set even though APP_ENV=local would permit an open endpoint, so the
      # scrape path this stack exercises is the same one a deployment uses.
      METRICS_ENABLED: "true"
      METRICS_TOKEN: local-compose-metrics-token-not-for-production-use
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      # The only writable paths the process gets.
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host: only the gateway needs to reach it.
    expose:
      - "5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # The vault is ephemeral by design. No AOF, no RDB -- a restart drops
    # in-flight mappings, which is the intended blast radius.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-ttl
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "6379"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  postgres-data:
