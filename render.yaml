# Render blueprint: API, workspace, Postgres, and Key Value.
#
# Object storage is **AWS S3** (ADR-0035) and is therefore not in this file.
# There is nothing to declare: no service, no disk, no internal hostname. The
# API reaches a bucket you own, over the internet, with credentials Render
# holds as secrets.
#
# Two consequences, stated because they are easy to discover late:
#
#   * Render cannot assume an AWS IAM role, so this deployment uses a static
#     access key pair. Scope it to one bucket and rotate it on a schedule --
#     the role-based posture the application supports is not available here.
#   * The bucket must already exist, with public access blocked. Nothing in
#     this blueprint creates it, and the first upload is where you find out.
#
# Every secret is `sync: false`, meaning Render prompts for it and it never
# appears in this repository. Generate them with:
#
#     python -m scripts.generate_deploy_secrets
#
# and check them before deploying with:
#
#     python -m scripts.check_deploy_config
#
# The second one matters. `Settings` refuses to build under APP_ENV=production
# if a secret is a placeholder, too short, all zeroes, or missing — so a bad
# value fails at boot with a container that will not start. Running the same
# validation locally turns that into a message on your laptop.

services:
  # ---------------------------------------------------------------------------
  # Gateway API
  # ---------------------------------------------------------------------------
  - type: web
    name: sgw-api
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    # Liveness, not readiness. A readiness probe fails when a dependency is
    # down, and Render would take the instance out of rotation for something a
    # restart cannot fix — turning a degraded gateway into an absent one.
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: 8000
      - key: LOG_LEVEL
        value: INFO

      - key: DATABASE_URL
        fromDatabase:
          name: sgw-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sgw-keyvalue
          property: connectionString

      # AWS S3. No endpoint: S3 resolves its own, and production refuses a
      # provider and an endpoint that disagree (ADR-0034) because that
      # misconfiguration is otherwise silent.
      - key: OBJECT_STORE_PROVIDER
        value: aws
      - key: OBJECT_STORE_BUCKET
        sync: false
      - key: OBJECT_STORE_REGION
        sync: false
      # Static credentials, because Render cannot assume an IAM role. The
      # application prefers a role where one is available; this is the fallback,
      # not the recommended posture.
      - key: OBJECT_STORE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORE_SECRET_ACCESS_KEY
        sync: false

      # Secrets. Generate with scripts/generate_deploy_secrets.py; production
      # refuses placeholders, short values, and all-zero keys.
      - key: API_KEY_PEPPER
        sync: false
      - key: AUDIT_HMAC_KEY
        sync: false
      - key: VAULT_ACTIVE_KEY_ID
        value: prod1
      - key: VAULT_KEY_PROD1
        sync: false
      - key: DOCUMENT_ACTIVE_KEY_ID
        value: prod1
      - key: DOCUMENT_KEY_PROD1
        sync: false
      - key: METRICS_TOKEN
        sync: false

      - key: DOCUMENTS_ENABLED
        value: "true"
      - key: METRICS_ENABLED
        value: "true"
      # Mock by default so a first deploy cannot spend money (ADR-0016). Set
      # OPENAI_API_KEY and switch this to reach a real provider.
      - key: DEFAULT_PROVIDER
        value: mock
      # Must name the workspace origin exactly. A wildcard is refused in
      # production, which is the check catching a lazy deploy rather than an
      # inconvenience.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ---------------------------------------------------------------------------
  # Workspace (Next.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: sgw-workspace
    runtime: node
    plan: starter
    rootDir: frontend
    # `--include=dev` is required, not stylistic. NODE_ENV=production below
    # makes plain `npm ci` skip devDependencies, and Tailwind, PostCSS, and
    # autoprefixer live there -- so the CSS pipeline fails at build time with a
    # module-resolution error inside PostCSS rather than anything that names
    # the real cause.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Baked into the client bundle at build time, so it must be the API's
      # public URL and not an internal hostname — the browser makes this call,
      # not the server.
      - key: NEXT_PUBLIC_GATEWAY_ORIGIN
        sync: false

  # ---------------------------------------------------------------------------
  # Session vault (Redis / Key Value)
  # ---------------------------------------------------------------------------
  #
  # VERIFY THIS BLOCK AGAINST RENDER'S CURRENT BLUEPRINT REFERENCE BEFORE
  # DEPLOYING. Render renamed its Redis offering to "Key Value", and I am not
  # certain whether the blueprint key is still `type: redis` or now
  # `type: keyvalue` — the `fromService` reference above uses the same name and
  # must match whichever it is. Everything else in this file I am confident
  # about; this one block is a guess with a plausible shape.
  #
  # `ipAllowList: []` is not an oversight. Empty means *no* external addresses,
  # so the store is reachable only from inside this blueprint. The vault holds
  # reversible mappings to original values and is the highest-value store in the
  # system (docs/threat-model.md); it should never be publicly addressable.
  - type: keyvalue
    name: sgw-keyvalue
    plan: starter
    ipAllowList: []
    # Mappings carry their own TTL and are re-mintable, so eviction under
    # pressure costs a re-tokenization rather than data loss.
    maxmemoryPolicy: allkeys-lru

databases:
  - name: sgw-postgres
    plan: basic-256mb
    postgresMajorVersion: "16"
