# Development override: publishes PostgreSQL, Redis, and the MinIO API to the
# host so the gateway -- or the integration suite -- can be run outside a
# container against them.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d \
#       postgres redis minio minio-init
#
# The base compose file deliberately does not publish these ports -- only the
# gateway needs to reach them, and a database listening on a developer's network
# interface is a bad default. Use this file only for local development, and
# never as part of a deployed configuration.
#
# All are bound to 127.0.0.1 explicitly, so they are reachable from this
# machine and from nowhere else.
#
# The MinIO API port is here rather than in the base file because the object
# store integration suite runs on the host and talks to it directly:
#
#   TEST_OBJECT_STORE_ENDPOINT=http://localhost:9000 \
#       pytest tests/integration/test_documents_minio.py -m integration
#
# Without a published API port those tests skip, and a skipped storage test
# verifies the adapter against nothing.

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    ports:
      - "127.0.0.1:9000:9000"
